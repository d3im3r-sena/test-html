<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Documentación técnica y científica en formato LaTeX (.tex) sobre Robótica Industrial: cinemática 6-DOF, control por par computado, cobots bajo norma ISO y visión artificial." />
    <title>Documentación LaTeX: Robótica Industrial | Centro Nova</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nova Robótica Docs" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />

    <!-- KaTeX CDN para Renderizado Matemático Ultrarrápido -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>

    <!-- MathJax 3 como Respaldo Complementario -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Estilos Principales -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="docs-body">
    
    <!-- Barra Superior de la Documentación -->
    <header class="docs-header">
      <div class="docs-header-left">
        <a href="index.html" class="back-link" title="Regresar al Centro de Ciencia Nova">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          <span>Centro Nova</span>
        </a>

        <div class="docs-brand-divider"></div>

        <div class="docs-brand-title">
          <span class="badge" style="margin: 0; padding: 2px 8px; font-size: 0.7rem;">LaTeX Docs</span>
          <h2>Robótica Industrial</h2>
        </div>
      </div>

      <!-- Selector de Modo: Paper vs Código TeX -->
      <div class="docs-view-switcher">
        <button id="tabPaper" class="tab-btn active" title="Ver artículo formateado">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13"/><line x1="16" x2="8" y1="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Artículo Renderizado</span>
        </button>
        <button id="tabSource" class="tab-btn" title="Ver código fuente LaTeX original">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>Código LaTeX (.tex)</span>
        </button>
      </div>

      <!-- Acciones y Herramientas -->
      <div class="docs-header-actions">
        <!-- Alternar Tema de Fondo del Paper -->
        <button id="btnThemeToggle" class="tool-btn" title="Cambiar tema de fondo del artículo" aria-label="Cambiar tema de fondo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span>Fondo Oscuro</span>
        </button>

        <!-- Ajuste Tipográfico -->
        <div class="font-zoom-group">
          <button id="btnFontDecrease" class="tool-btn-icon" title="Reducir tamaño de fuente" aria-label="Reducir fuente">A-</button>
          <button id="btnFontIncrease" class="tool-btn-icon" title="Aumentar tamaño de fuente" aria-label="Aumentar fuente">A+</button>
        </div>

        <!-- Descargar .tex -->
        <button id="btnDownloadTex" class="tool-btn" title="Descargar archivo fuente .tex">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>Descargar .tex</span>
        </button>

        <!-- Imprimir a PDF -->
        <button id="btnPrintDoc" class="tool-btn" title="Imprimir o exportar a PDF">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
          <span>Imprimir / PDF</span>
        </button>

        <!-- Botón Menú Móvil Lateral -->
        <button id="toggleDocsDrawer" class="menu-toggle" aria-label="Abrir catálogo e índice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </header>

    <!-- Layout Principal de Documentación -->
    <div class="docs-layout">
      
      <!-- Fondo Oscuro para Drawer Móvil -->
      <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <!-- Barra Lateral: Catálogo de Documentos & Índice TOC -->
      <aside id="docsSidebar" class="docs-sidebar">
        
        <!-- Buscador de Artículos -->
        <div class="docs-search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="docsSearchInput" placeholder="Buscar en robótica..." aria-label="Buscar en artículos de robótica" />
        </div>

        <!-- Lista de Artículos .tex Disponibles -->
        <div class="docs-nav-section">
          <h3 class="docs-section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
            Artículos Técnicos (.tex)
          </h3>
          <div id="docsList" class="doc-nav-list">
            <!-- Inyectado dinámicamente por docs-viewer.js -->
          </div>
        </div>

        <!-- Tabla de Contenidos (TOC) del Documento Activo -->
        <div class="docs-nav-section">
          <h3 class="docs-section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
            Tabla de Contenidos
          </h3>
          <nav id="docTocList" class="doc-toc-wrapper" aria-label="Tabla de contenidos del artículo">
            <p class="toc-empty">Cargando secciones...</p>
          </nav>
        </div>

        <!-- Créditos y Enlace a Nova -->
        <div class="docs-sidebar-footer">
          <p>Laboratorio de Robótica Industrial Nova © 2026</p>
          <a href="index.html#actividades">← Explorar Talleres de Robótica</a>
        </div>
      </aside>

      <!-- Lienzo Principal de Visualización -->
      <main id="docViewerContent" class="docs-main-content">
        
        <!-- Vista 1: Artículo Renderizado (Formato Paper Académico) -->
        <div id="paperView" class="latex-paper-wrapper theme-paper-light">
          <!-- Inyectado dinámicamente por LatexParser y DocsViewer -->
        </div>

        <!-- Vista 2: Código Fuente Original LaTeX (.tex) con Numeración -->
        <div id="sourceView" class="latex-source-wrapper" style="display: none;">
          <div class="source-toolbar">
            <span class="source-filename">Código Fuente LaTeX (.tex)</span>
            <button id="btnCopySource" class="btn btn-outline" style="padding: 0.35rem 0.85rem; font-size: 0.82rem;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              <span>Copiar Código</span>
            </button>
          </div>
          <pre id="sourceCodeBlock" class="source-code-block"></pre>
        </div>

      </main>

    </div>

    <!-- Scripts del Motor y Controlador -->
    <script src="js/latex-parser.js"></script>
    <script src="js/docs-viewer.js"></script>
  </body>
</html>
