<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="70%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Aura -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>

  <!-- Orbits -->
  <g transform="translate(256, 256)">
    <!-- Orbit 1 -->
    <ellipse rx="190" ry="70" fill="none" stroke="url(#orbitGrad1)" stroke-width="6" stroke-dasharray="10 6" transform="rotate(-30)"/>
    <!-- Orbit 2 -->
    <ellipse rx="190" ry="70" fill="none" stroke="url(#orbitGrad2)" stroke-width="6" stroke-dasharray="8 6" transform="rotate(35)"/>
    <!-- Orbit 3 Horizontal -->
    <ellipse rx="180" ry="55" fill="none" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.5" transform="rotate(90)"/>

    <!-- Orbiting Bodies -->
    <circle cx="160" cy="-60" r="12" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-140" cy="70" r="10" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="0" cy="-180" r="8" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Central Star / Pulsar Core -->
    <circle cx="0" cy="0" r="54" fill="url(#coreGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    
    <!-- Rays of Energy -->
    <path d="M 0 -85 L 0 -60 M 0 60 L 0 85 M -85 0 L -60 0 M 60 0 L 85 0" stroke="#bae6fd" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography in Icon -->
  <text x="256" y="445" font-family="'Outfit', sans-serif, system-ui" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="8">NOVA</text>
</svg>
